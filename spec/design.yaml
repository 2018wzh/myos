system: RV64GC 单体教学内核：Lab4 首个用户进程与用户陷入闭环。
machine:
  board: QEMU virt
  memory: 128MiB
  harts: HARTS=1或2，默认2；hart0创建唯一用户进程。
mechanisms:
- Sv39内核/用户页表
- 独立内核栈与trapframe
- swtch和trampoline
- 用户ecall、CLINT时钟和PLIC/UART中断
rules:
- 各模块契约共同约束系统；头文件提供类型与ABI，不能替代行为契约。
- 用户零页不映射；用户页表不暴露内核可写资源。
- 先建立内存和trap环境，再发布首进程；其他hart只在共享初始化发布后访问共享模块。
non_goals:
- 多进程调度和完整fork/wait/exit生命周期
- 文件系统与块设备
- 首进程故障后重启或重建用户执行
