module: kernel/syscall
owns:
  - src/kernel/syscall/syscall.c
  - src/kernel/syscall/sysfunc.c
  - src/kernel/syscall/type.h
  - src/kernel/syscall/method.h
  - src/kernel/syscall/mod.h
state:
  syscall_table: 按user/syscall_num.h编号索引的处理函数表；类型syscall_fn_t为无参数并返回uint64的函数指针。
rules:
  - 从当前trapframe的a7取调用号、a0至a5取参数，结果写回a0；编号与用户侧一致。
  - 用户指针只能通过uvm复制接口访问；普通用户错误返回失败，不panic。
  - 本模块只分发并适配参数，内存和进程状态转换遵守对应模块契约。
functions:
  "void syscall(void);":
    pre:
      - 当前进程有有效trapframe。
    effects:
      - 检查调用号范围和表项后调用处理函数，并写回a0。
    post:
      - 未知调用号的a0为(uint64)-1；正常调用写入其返回值；exit不返回。
  "uint64 arg_raw(int n);":
    pre:
      - 当前进程有有效trapframe；n在0至5之间。
    effects:
      - 读取对应a寄存器。
    post:
      - 返回参数原始64位值；内核传入非法n时panic。
  "void arg_uint32(int n, uint32 *ip);":
    pre:
      - n在0至5之间，ip指向有效内核输出对象。
    effects:
      - 将原始参数低32位写入ip。
    post:
      - 不解引用参数所表示的用户地址。
  "void arg_uint64(int n, uint64 *ip);":
    pre:
      - n在0至5之间，ip指向有效内核输出对象。
    effects:
      - 将原始64位参数写入ip。
    post:
      - 不解引用参数所表示的用户地址。
  "int arg_str(int n, char *buf, int maxlen);":
    pre:
      - n在0至5之间，buf具有maxlen字节可写内核空间。
    effects:
      - 将参数指定的用户字符串通过uvm_copyin_str复制到buf。
    post:
      - 含NUL的字符串完整复制返回0；maxlen非正、无终止符或非法用户地址返回-1，允许已复制前缀。
  "uint64 sys_brk(void);":
    effects:
      - 读取参数0作为目标堆顶，调用堆管理；调整量不能用uint32表示时返回失败，仅成功后更新heap_top。
    post:
      - 参数0为0时查询当前堆顶；成功返回新堆顶，越界或资源不足返回(uint64)-1且原映射和heap_top不变。
  "uint64 sys_mmap(void);":
    effects:
      - 将参数0作为起点、参数1完整64位作为字节长度；要求非零、页对齐且不超过mmap区域容量，再换算为页数调用uvm_mmap建立用户RW区间。
    post:
      - 成功返回起点；参数或资源错误返回0，失败不发布映射；起点0表示自动选择地址。
  "uint64 sys_munmap(void);":
    effects:
      - 将参数0作为起点、参数1完整64位作为字节长度；要求非零、页对齐且不超过mmap区域容量，再换算为页数调用uvm_munmap。
    post:
      - 成功返回0，失败返回(uint64)-1且原映射和区间表不变。
  "uint64 sys_print_str(void);":
    effects:
      - 安全复制参数0指定的NUL结尾字符串，最多256字节含NUL，成功后输出。
    post:
      - 成功返回0；非法地址或未在上限内终止返回(uint64)-1且不输出部分字符串。
  "uint64 sys_print_int(void);":
    effects:
      - 将参数0低32位解释为有符号整数并输出一行。
    post:
      - 返回0。
  "uint64 sys_getpid(void);":
    effects:
      - 读取当前进程pid。
    post:
      - 返回当前pid。
  "uint64 sys_fork(void);":
    effects:
      - 调用proc_fork。
    post:
      - 父进程返回子pid，子进程返回0；失败返回(uint64)-1。
  "uint64 sys_wait(void);":
    effects:
      - 将参数0作为退出码输出用户地址并调用proc_wait。
    post:
      - 返回被回收子pid，失败返回(uint64)-1；地址0不复制退出码。
  "uint64 sys_exit(void);":
    effects:
      - 将参数0低32位解释为有符号退出码并调用proc_exit。
    post:
      - 不返回。
  "uint64 sys_sleep(void);":
    effects:
      - 按参数0低32位指定的tick数调用timer_wait。
    post:
      - 至少经过该数量的共享tick后返回0；0立即返回。
