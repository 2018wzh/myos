module: kernel/process
owns:
- src/kernel/proc/proc.c
- src/kernel/proc/swtch.S
- src/kernel/proc/type.h
- src/kernel/proc/method.h
state:
  cpus: 每 hart 的当前进程指针与保存的内核上下文；tp 索引，有效范围由 MAX_HARTS 定义。
  proczero: 唯一用户进程，拥有用户页表、trapframe、用户代码页和栈页；使用预先映射的 KSTACK(0)。
  context_t: 依次为 ra、sp、s0..s11 的 64 位槽；C 与 swtch 汇编布局一致。
  user_trapframe_t: 288 字节：前五槽为 kernel_satp/kernel_sp/kernel_trap/epc/kernel_hartid，其后按给定头文件排列全部用户整数寄存器；a0
    偏移112，t6偏移280。
rules:
- 首进程构造完成前不得发布为运行状态；失败不留下半初始化进程。
- 虚拟地址零页不映射；TRAMPOLINE RX 和 TRAPFRAME RW 不含 PTE_U；用户代码 RXU、栈 RWU。
- 本阶段不引入多进程 scheduler；首进程通过 swtch 与 proc_return 首次进入用户态。
functions:
  cpu_t *mycpu(void):
    effects: []
    post:
    - 返回 tp 对应的 cpus 元素；无效 hart id 是内核不变量错误。
  proc_t *myproc(void):
    effects:
    - 经 push_off/pop_off 读取当前进程。
    post:
    - 返回当前 hart 的进程指针，允许 NULL；返回时恢复本次关中断嵌套。
  void proc_init(void):
    pre:
    - 尚无运行用户进程。
    effects:
    - 初始化进程与 CPU 状态。
    post:
    - 初始化 cpus 和 proczero 锁、名称及 UNUSED 状态。
  pgtbl_t proc_pgtbl_init(uint64 trapframe):
    pre:
    - trapframe 是调用者独占的已分配页且页对齐。
    effects:
    - 分配内核页表页，创建两项系统映射。
    post:
    - 成功返回零初始化根页表，映射共享 trampoline 与给定 trapframe；两者均不可由用户访问。
    - 不足返回 NULL，回收本次页表页，保留调用者 trapframe 和共享 trampoline。
  void proc_make_first(void):
    pre:
    - 内存、内核页表、trap 和 proc_init 已完成；仅 hart 0 调用一次。
    effects:
    - 分配首进程资源，更新页表、上下文和当前进程，切换执行流。
    post:
    - 成功从同次构建的 initcode 加载不超过一页的代码到 USER_BASE，建立 USER_STACK，epc=USER_BASE、sp=USER_STACK_TOP。
    - 初始化上下文 ra=proc_return、sp=KSTACK(0)+PAGE_SIZE；持进程锁发布 RUNNING 和当前 CPU 指针后 swtch。
    - 分配或映射不足回收已分配用户页、trapframe和页表，恢复 UNUSED、释放锁，留在可处理中断的内核循环，不进入用户态、不返回。
  void proc_return(void):
    pre:
    - 当前进程已经 RUNNING，当前 hart 持有其锁。
    effects:
    - 结束首进程锁的本次关中断嵌套，进入用户态。
    post:
    - 释放交接的进程锁，调用 trap_user_return，不返回。
  void swtch(context_t *old, context_t *new):
    pre:
    - old/new 是互不重叠的可读写有效 context_t；目标 sp/ra 有效。
    effects:
    - 写 old 上下文，替换当前寄存器和控制流。
    post:
    - 保存当前 ra/sp/s0..s11 到 old，恢复 new 对应寄存器，经恢复的 ra 继续；old 将来被恢复时，本次调用才继续返回。
