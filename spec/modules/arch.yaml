  "uint64 r_time(void);":
    pre:
      - "当前特权级已获准读取 time。"
    effects: []
    post:
      - "返回 rdtime 读取的当前 64 位时间计数，不表示系统 tick 数。"
  "void intr_on(void);":
    pre:
      - "当前 hart 不在 push_off 尚未配对退出的区域。"
    effects:
      - "置当前 hart 的 SSTATUS.SIE。"
    post:
      - "只开启监督者全局中断位，其他 sstatus 位不变；不会开启被 sie 屏蔽的源。"
  "void intr_off(void);":
    effects:
      - "清当前 hart 的 SSTATUS.SIE。"
    post:
      - "当前 hart 的监督者全局中断关闭，其他 sstatus 位不变；不关闭 M 模式定时器。"
  "int intr_get(void);":
    effects: []
    post:
      - "SSTATUS.SIE 置位返回 1，否则返回 0。"
  "uint64 r_sp(void);":
    effects: []
    post:
      - "返回执行读取指令时当前 hart 的 sp 寄存器值。"
  "uint64 r_tp(void);":
    effects: []
    post:
