  "void w_tp(uint64 value);":
    effects:
      - "将当前 hart 的 tp 设置为 value。"
    post:
      - "后续 tp 读取获得 value。"
  "void sfence_vma(void);":
    effects:
      - "执行 sfence.vma zero, zero，并建立编译器内存屏障。"
    post:
      - "当前 hart 的全部地址空间和 ASID 的本地地址转换缓存失效；其他 hart 不受影响。"
