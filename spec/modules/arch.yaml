module: kernel/arch
owns:
  - src/kernel/arch/mod.c
  - src/kernel/arch/mod.h
  - src/kernel/arch/method.h
  - src/kernel/arch/type.h
state:
  mstatus: 机器模式中断、返回特权级及浮点状态控制。
  mepc: 下一次 mret 的返回地址。
  mhartid: 硬件 hart 标识，只读。
  medeleg: 同步异常向监督者模式的委派位。
  mideleg: 中断向监督者模式的委派位。
  mie: 机器模式中断源使能位。
  mtvec: 机器模式 trap 入口和模式。
  mscratch: 机器模式 trap 使用的暂存值或每 hart scratch 地址。
  mcounteren: 向较低特权级开放硬件计数器的控制位。
  pmpcfg0: 第一组物理内存保护条目的属性。
  pmpaddr0: 第一个物理内存保护条目的地址编码。
  sstatus: 监督者中断使能、返回状态和前一特权级。
  sie: 监督者中断源使能位。
  sip: 监督者 pending 位，部分位由硬件管理。
  sepc: 下一次 sret 的返回地址。
  stvec: 监督者 trap 入口和模式。
  sscratch: 监督者 trap 暂存寄存器。
  satp: 地址转换模式、ASID 和根页表物理页号。
  scause: 最近一次监督者 trap 的中断标志及原因。
  stval: 最近一次监督者异常附加值。
  time: 平台提供的递增时间计数器。
  stimecmp: Sstc 平台上的监督者定时器比较值。
  tp: 内核期间的当前 hart ID；用户期间由用户上下文管理。
rules:
  - HART_COUNT 只允许 1 或 2，默认 2；NCPU 和 MAX_HARTS 与 HART_COUNT 相等，平台启动 hart 数必须与配置一致。
  - m 开头 CSR 和 PMP 接口在 M 模式调用；s 开头 CSR 接口在 S 或 M 模式调用，stimecmp 还要求平台支持并开放 Sstc。
  - 写接口只修改所命名寄存器；CSR 的只读位与 WARL 字段遵循硬件约束，调用者提供合法编码。
  - w_satp 不替调用者执行 sfence.vma；修改地址空间和 TLB 失效必须由上层协议配对。
  - 内核 tp 保存范围内 hart ID，用户进入内核由 trampoline 恢复，退出时恢复用户 tp；内核调用 w_tp 不得破坏已有每 hart 状态归属。
functions:
