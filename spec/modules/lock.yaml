module: kernel/lock
owns:
  - src/kernel/lock/spinlock.c
  - src/kernel/lock/type.h
  - src/kernel/lock/method.h
state:
  spinlock_t: 原子锁字、名称和持有hart标识；未持有时owner不对应有效hart。
  sleeplock_t: 内部spinlock_t、locked、pid、name；行为由kernel/sleeplock定义。
  interrupt_state: cpu_t.noff为每hart关闭中断的嵌套深度，intena为最外层push_off之前的中断状态，经mycpu访问。
rules:
  - 自旋锁先push_off再竞争，释放锁后pop_off；递归获取及非持有者释放panic。
  - acquire/release提供跨hart的内存可见性；锁保护范围不能仅依赖volatile。
  - cpu_t的中断记账只在无锁且无push_off嵌套时初始化；proc_init不得清零仍使用中的记账。
  - scheduler跨上下文交接进程锁时保留嵌套深度1，proc_sched保存恢复执行流的intena；解锁使用恢复运行的当前hart。
functions:
  "uint64 hart_id(void);":
    effects:
      - 读取内核tp。
    post:
      - 返回当前hart编号。
  "void push_off(void);":
    effects:
      - 关闭中断，最外层记录原状态，并将当前hart的noff加1。
    post:
      - 中断关闭，嵌套调用不覆盖最外层intena。
  "void pop_off(void);":
    pre:
      - 中断关闭且当前hart的noff大于0。
    effects:
      - noff减1，仅在减为0且intena为true时开中断。
    post:
      - 恢复匹配最外层push_off前的中断状态；未配对或意外开中断panic。
  "void spinlock_init(spinlock_t *lk, const char *name);":
    effects:
      - 设置名称、清除锁字和持有者。
    post:
      - lk可被获取。
  "bool spinlock_holding(spinlock_t *lk);":
    pre:
      - lk已初始化；调用者已关闭中断，读取期间不会迁移。
    effects:
      - 读取锁字和持有hart。
    post:
      - 当前hart持有时返回true，不改变锁或中断状态。
  "void spinlock_acquire(spinlock_t *lk);":
    pre:
      - lk已初始化，当前hart尚未持有。
    effects:
      - push_off并原子竞争锁，取得后登记当前hart。
    post:
      - 当前hart独占锁且中断关闭；之前持有者的临界区写入可见。
  "void spinlock_release(spinlock_t *lk);":
    pre:
      - 当前hart持有lk。
    effects:
      - 发布临界区写入，清除持有者并原子释放锁，再pop_off。
    post:
      - 锁可被其他hart获取，中断状态按嵌套规则恢复。
