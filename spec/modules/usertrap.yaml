module: kernel/usertrap
owns:
  - src/kernel/trap/trap_user.c
  - src/kernel/trap/trampoline.S
state:
  trampoline: 单页共享RX代码；链接符号trampoline为页基址，用户页表与内核页表在TRAMPOLINE映射同一物理页。
  user_state: trapframe保存用户通用寄存器、返回epc及进入内核所需satp/sp/handler/hart；具体布局由kernel/process定义。
rules:
  - 用户trap入口与返回路径在切换satp前后都可取指，切换后按RISC-V要求同步地址翻译。
  - 用户通用寄存器包括用户tp须完整保存；内核执行中的tp始终表示当前hart，进程迁移后不得恢复过期内核hart编号。
  - syscall只推进epc一次且恰为4；页故障修复后重试原指令。
functions:
  "user_vector":
    pre:
      - 当前已从U-mode陷入S-mode，stvec指向用户trampoline入口，TRAPFRAME可由S-mode访问。
    effects:
      - 保存所有用户通用寄存器，取得当前进程内核栈、内核hart编号和页表，切换后进入trap_user_handler。
    post:
      - 用户寄存器未丢失，C处理器在内核页表和当前进程内核栈运行。
  "void trap_user_handler(void);":
    pre:
      - 当前进程有效，异常来源为U-mode。
    effects:
      - 切stvec至内核入口并保存epc；ecall保存返回状态后允许中断以支持内核态抢占，再交给syscall，合法栈缺页尝试扩展；设备中断正常分发，时钟中断可yield。
    post:
      - 成功路径调用trap_user_return；非法用户异常或无法修复的页故障通过proc_exit(-1)结束违规进程，不重试非法指令。
  "void trap_user_return(void) __attribute__((noreturn));":
    pre:
      - 当前进程及trapframe、用户页表、内核栈有效。
    effects:
      - 关闭中断，准备当前hart的返回字段和用户stvec，设置sepc、清SPP、置SPIE，经user_return进入U-mode。
    post:
      - 不返回，用户从trapframe.epc继续，使用本进程用户页表。
  "user_return":
    pre:
      - a0为TRAPFRAME，a1为用户satp；sepc/sstatus及trampoline映射已准备。
    effects:
      - 切换用户页表，恢复包括a0在内的用户通用寄存器并sret。
    post:
      - 在U-mode原用户栈继续执行，不返回C调用者。
