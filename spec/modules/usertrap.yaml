module: kernel/usertrap
owns:
  - src/kernel/trap/trap_user.c
  - src/kernel/trap/trampoline.S
state:
  用户trap状态: trapframe保存用户寄存器和epc，并携带kernel_satp、kernel_sp、kernel_trap、kernel_hartid。
  trampoline: 同一物理页在内核与所有用户页表的TRAMPOLINE虚拟地址提供监督者RX映射。
rules:
  - 用户trap时先完整保存用户寄存器再切换内核页表；切换satp时执行必要的sfence.vma；trapframe物理页不向U-mode开放。
  - C处理用户trap期间stvec使用kernel_vector；返回用户态前关闭当前hart中断并安装用户向量，避免过渡状态被中断打断。
  - ecall保存的epc只推进4一次；栈缺页成功后epc不变，返回重试原指令。
  - 用户非法异常或栈资源不足停止该用户程序并留在内核，不能以panic处理用户请求；内核上下文矛盾才panic。
functions:
  'void trap_user_handler(void);':
    pre:
      - 从U-mode进入，当前进程、trapframe及内核栈有效；user_vector已保存用户寄存器。
    effects:
      - 安装kernel_vector并保存sepc；用户ecall推进epc后交给syscall。
      - 用户load/store缺页交给uvm_ustack_grow，成功后发布ustack_npage；设备中断由既有trap中断处理机制处理。
    post:
      - 已处理的ecall、中断及合法栈缺页通过trap_user_return继续用户执行。
      - 已映射页权限错误、非栈缺页、指令缺页及其他用户异常不能借栈增长获得访问；未处理异常或资源不足停止用户执行，增长失败保留原映射及页数。
  'void trap_user_return(void) __attribute__((noreturn));':
    pre:
      - 当前进程的页表、trapframe及内核栈有效。
    effects:
      - 填入trapframe内核返回字段，安装TRAMPOLINE内user_vector地址，清除SPP并设置SPIE、sepc。
      - 以a0=TRAPFRAME、a1=用户satp调用user_return。
    post:
      - sret后恢复用户上下文并在epc处继续，函数不返回。
  user_vector:
    pre:
      - trap源为U-mode，stvec指向TRAMPOLINE内本符号；sscratch为TRAPFRAME，用户页表含两项特殊映射。
    effects:
      - 将用户整数寄存器保存到trapframe，取得内核页表、栈、hart身份和handler后切换至内核上下文。
    post:
      - 到达trap_user_handler；用户a0保存在正确字段，完整寄存器布局与user_trapframe_t一致。
  user_return:
    pre:
      - a0为TRAPFRAME，a1为用户satp；sepc、sstatus和trapframe已准备，当前hart中断关闭。
    effects:
      - 切换用户页表、同步TLB、设置sscratch、恢复所有用户整数寄存器并执行sret。
    post:
      - 在U-mode继续执行，用户a0取trapframe.a0，内核字段不作为用户寄存器恢复。
