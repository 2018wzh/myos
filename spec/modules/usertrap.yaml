module: kernel/usertrap
owns:
- src/kernel/trap/trap_user.c
- src/kernel/trap/trampoline.S
state:
  trampoline: 页对齐共享代码，内核和用户页表在 TRAMPOLINE 映射同一物理页；段长不超过一页。
  TRAPFRAME: 当前进程用户页表中的非用户 RW 映射；布局由 proc/type.h 固定。
rules:
- 切换 satp 前后均在同一 TRAMPOLINE 虚拟地址执行并刷新 TLB；用户寄存器保存和恢复不得混用页表。
- 未知系统调用返回 -1；用户执行错误停止故障进程，不触发内核 panic；内核状态矛盾才 panic。
functions:
  user_vector:
    pre:
    - 来自 U-mode，sscratch/TRAPFRAME 和双页表 trampoline 映射有效。
    effects:
    - 写 trapframe，改变 satp、栈、hart 标识和控制流。
    post:
    - 完整保存用户整数寄存器到 TRAPFRAME，恢复内核 sp/tp，切换到 kernel_satp，再进入 kernel_trap。
  void trap_user_handler(void):
    effects:
    - 更新当前 trapframe、处理设备/时钟中断及系统调用输出，修改当前 hart trap CSR。
    post:
    - 保存 sepc，立即将 stvec 切回 kernel_vector。
    - ecall 只推进 epc 4 字节一次；SYS_helloworld 输出进程名和 hello world，a0=0；未知号 a0=-1。
    - 已识别设备/时钟中断处理后继续原用户指令；其他异常输出原因和地址，停止当前用户执行，并保持其他 hart 可处理中断。
    - 可继续的执行经 trap_user_return 恢复用户态。
  void trap_user_return(void):
    pre:
    - 当前进程、trapframe、用户页表和独立内核栈有效。
    effects:
    - 写当前 hart CSR 和 trapframe 内核字段，切换页表与特权级。
    post:
    - 关闭中断后设置用户向量和 trapframe 内核字段；清除 SPP、设置 SPIE、恢复 epc，经 user_return 返回 U-mode，不返回 C 调用者。
  user_return:
    pre:
    - SPP 已清零，sepc 和 SPIE 已准备；trampoline 在两套页表均可执行。
    effects:
    - 修改 satp/sscratch，恢复整数寄存器和用户执行流。
    post:
    - a0 为 TRAPFRAME，a1 为用户 satp；切换页表、刷新 TLB，完整恢复用户寄存器，以 sret 进入已准备的用户 PC。
