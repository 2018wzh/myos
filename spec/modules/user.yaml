module: user/initcode
owns:
- src/user/initcode.c
- src/user/sys.h
- src/user/syscall_arch.h
- src/user/syscall_num.h
state:
  initcode镜像: 构建生成的非空平坦用户字节镜像，最多PAGE_SIZE字节，从USER_BASE开始，首条指令属于main。
  syscall_num: SYS_helloworld=0，SYS_copyin=1，SYS_copyout=2，SYS_copyinstr=3，SYS_brk=4，SYS_mmap=5，SYS_munmap=6，SYS_printf=7。
rules:
- __syscall0至__syscall6将编号放a7、参数依次放a0至a5，执行一次ecall并从a0取得返回值；内联汇编声明memory影响。
- 通用syscall宏按参数数量调用对应封装，保留原始64位返回位型；专用封装按各自类型解释状态或地址。
- 用户入口布局由链接脚本或专用入口section明确保证main位于USER_BASE；不能依赖优化级别或函数自动重排。
- 用户程序通过系统调用输出或管理内存，不直接访问内核、trapframe或trampoline。
functions:
  int main(void);:
    pre:
    - 在U-mode从USER_BASE执行，sp为USER_STACK_TOP，拥有初始一页栈。
    effects:
    - 使用Lab5复制、堆增长、栈缺页及mmap/munmap接口运行用户示例。
    post:
    - 请求失败由用户程序按返回值处理；本阶段没有exit服务，main保持执行而不返回到未定义地址。
  static inline long helloworld(void);:
    effects:
    - 发起SYS_helloworld。
    post:
    - 返回0。
  static inline int copyin(const void *src, unsigned long count);:
    effects:
    - 发起SYS_copyin读取count个int并请求内核输出。
    post:
    - 成功返回0，失败返回-1；count单位为int个数。
  static inline int copyout(void *dst);:
    effects:
    - 发起SYS_copyout向dst写入固定五个int。
    post:
    - 成功返回0，失败返回-1；失败可留下已写入前缀。
  static inline int copyinstr(const char *src);:
    effects:
    - 发起SYS_copyinstr读取并输出用户字符串。
    post:
    - 成功返回0，失败返回-1。
  static inline long brk(unsigned long top);:
    effects:
    - 发起SYS_brk查询或调整当前堆顶。
    post:
    - top为0时返回当前堆顶；调整成功返回新堆顶，失败返回-1。
  static inline unsigned long mmap(void *start, unsigned long len);:
    effects:
    - 发起SYS_mmap，len以字节计。
    post:
    - 成功返回非零映射起点，失败返回0；start为NULL选择最低可用区间。
  static inline int munmap(void *start, unsigned long len);:
    effects:
    - 发起SYS_munmap，len以字节计。
    post:
    - 成功返回0，失败返回-1。
  static inline long user_printf(const char *s);:
    effects:
    - 发起SYS_printf输出s。
    post:
    - 成功返回0，失败返回-1。
