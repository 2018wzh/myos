module: user/initcode
owns:
- src/user/initcode.c
- src/user/sys.h
- src/user/syscall_arch.h
- src/user/syscall_num.h
state:
  initcode: 构建在BUILD_DIR生成的initcode.h提供平坦二进制数组及initcode_len；长度为1至PAGE_SIZE，入口指令位于USER_BASE。
  syscall_numbers: SYS_brk=1、SYS_mmap=2、SYS_munmap=3、SYS_print_str=4、SYS_print_int=5、SYS_getpid=6、SYS_fork=7、SYS_wait=8、SYS_exit=9、SYS_sleep=10。
  syscall_macro: syscall宏按普通参数数量选择__syscall0至__syscall6；所有参数转换为long，返回long结果。
rules:
- RISC-V系统调用ABI使用a7传调用号、a0至a5传普通参数、a0返回结果；ecall需正确声明寄存器和memory影响。
- 生成头文件在BUILD_DIR随本次用户源码构建更新，不写入src树，禁止依靠遗留initcode.h运行。
- 课程入口保持首进程存活并wait子进程；阶段验收场景由patches/lab6.yaml定义。
functions:
  int main(void);:
    effects:
    - 通过用户syscall封装驱动本阶段进程、内存和睡眠场景。
    post:
    - 父进程观察fork返回子pid、wait退出码与sleep顺序，子进程经exit退出；正常首进程最后保持运行。
  static inline long brk(unsigned long top);:
    effects:
    - 发起SYS_brk查询或调整堆顶。
    post:
    - top为0时返回当前堆顶，调整成功返回新堆顶，失败返回-1。
  static inline unsigned long mmap(void *start, unsigned long len);:
    effects:
    - 发起SYS_mmap，len单位为字节。
    post:
    - 成功返回非零起点，失败返回0；start为NULL请求选择最低可用区间。
  static inline int munmap(void *start, unsigned long len);:
    effects:
    - 发起SYS_munmap，len单位为字节。
    post:
    - 成功返回0，失败返回-1。
  static inline long user_printf(const char *s);:
    effects:
    - 发起SYS_print_str输出用户字符串。
    post:
    - 成功返回0，失败返回-1。
