module: kernel/uvm
owns:
  - src/kernel/mem/uvm.c
  - src/kernel/mem/mmap.c
state:
  用户页表: 独占用户数据页及页表页；trampoline物理页和trapframe物理页由其他所有者持有。
  用户地址布局: 低地址第一页无映射；代码位于USER_BASE；堆为[USER_HEAP_BASE, heap_top)，mmap为[MMAP_BEGIN, MMAP_END)，栈为[USER_STACK_TOP - ustack_npage * PAGE_SIZE, USER_STACK_TOP)。
  mmap节点池: MMAP_REGION_COUNT个可复用节点；节点唯一属于空闲池、某进程链或尚未发布的操作。
rules:
  - 地址和长度运算先检查上界及溢出，再进行加法、乘法或页对齐；用户请求非法和资源耗尽返回失败，所有权、页表结构等内核不变量损坏才panic。
  - 用户页必须为有效叶项并带PTE_U；读取需要PTE_R，写入需要PTE_W；禁止通过copy访问trampoline或trapframe。
  - heap、stack、mmap及页表复制只有完整成功后才发布新状态；失败保留操作前已发布映射和元数据并释放本次临时资源，临时资源如何组织由实现决定。
  - 用户复制逐页验证后复制该页片段；后续页面失败可留下已复制前缀，不承诺回滚目标内容。
  - 每个mmap链只含非空页对齐区间，按begin递增且互不重叠；权限相同的相邻区间合并；链描述的映射必须与页表一致。
  - mmap及堆栈事务由调用者在当前进程独占地址空间修改上下文中执行；节点池分配回收受自身锁保护。
  - 用户页表销毁不释放trampoline和trapframe物理页；进程另行回收trapframe、内核栈及mmap节点，任何资源只回收一次。
functions:
  'int uvm_copyin(pgtbl_t pgtbl, uint64 dst, uint64 src, uint32 len);':
    pre:
      - dst指向可容纳len字节的内核缓冲区；pgtbl在调用期间稳定。
    effects:
      - 将用户[src, src+len)依次复制到内核dst；支持非页对齐和跨页范围。
    post:
      - len为0时返回0且不访问内存；全部复制成功返回0。
      - 用户范围溢出、超过VA_MAX、缺页或缺少读取权限返回-1；逐页失败时目标可能已有前缀。
  'int uvm_copyout(pgtbl_t pgtbl, uint64 dst, uint64 src, uint32 len);':
    pre:
      - src指向可读取len字节的内核缓冲区；pgtbl在调用期间稳定。
    effects:
      - 将内核src依次复制到用户[dst, dst+len)；支持非页对齐和跨页范围。
    post:
      - len为0时返回0且不访问内存；全部复制成功返回0。
      - 用户范围溢出、超过VA_MAX、缺页或缺少写入权限返回-1；逐页失败时目标可能已有前缀。
  'int uvm_copyin_str(pgtbl_t pgtbl, uint64 dst, uint64 src, uint32 maxlen);':
    pre:
      - dst指向可容纳maxlen字节的内核缓冲区；pgtbl在调用期间稳定。
    effects:
      - 从用户src复制直到首个NUL，包含该NUL，最多写maxlen字节。
    post:
      - maxlen内遇到NUL且所有已访问页面可读时返回0。
      - maxlen为0、maxlen内无NUL、地址越界或页面不可读时返回-1；不保证失败缓冲区以NUL结尾，允许已复制前缀。
  'uint64 uvm_heap_grow(pgtbl_t pgtbl, uint64 cur_heap_top, uint32 len);':
    pre:
      - cur_heap_top与当前已发布堆布局一致。
    effects:
      - 为[PGROUNDUP(cur_heap_top), PGROUNDUP(cur_heap_top+len))增加清零PTE_R|PTE_W|PTE_U页面。
    post:
      - 新堆顶在[USER_HEAP_BASE, MMAP_BEGIN]内且分配成功时返回cur_heap_top+len；len为0不改映射。
      - 范围非法或任一资源不足返回(uint64)-1，原映射不变；不自行更新proc.heap_top。
  'uint64 uvm_heap_ungrow(pgtbl_t pgtbl, uint64 cur_heap_top, uint32 len);':
    pre:
      - cur_heap_top与当前已发布堆布局一致。
    effects:
      - 合法收缩时释放[PGROUNDUP(cur_heap_top-len), PGROUNDUP(cur_heap_top))的完整堆页，保留新堆顶所在部分页。
    post:
      - 新堆顶不低于USER_HEAP_BASE时返回cur_heap_top-len；len为0不改映射。
      - 无效范围或下溢返回(uint64)-1且映射不变；不自行更新proc.heap_top。
  'int64 uvm_ustack_grow(pgtbl_t pgtbl, uint64 old_ustack_npage, uint64 fault_addr);':
    pre:
      - old_ustack_npage与当前连续栈映射一致。
    effects:
      - fault_addr在合法栈区且低于旧栈底时，从其向下页对齐地址到旧栈底补齐所有清零PTE_R|PTE_W|PTE_U页面。
    post:
      - 成功返回新的总栈页数，可一次增加多页；不依赖编译器先访问紧邻旧栈底页面。
      - 地址不在[USER_STACK_BOTTOM, 旧栈底)、页数非法或资源不足时返回-1并保留原映射；不自行更新proc.ustack_npage。
  'void uvm_destroy_pgtbl(pgtbl_t pgtbl);':
    pre:
      - 非空页表已停止使用，独占其用户叶页和页表页。
    effects:
      - 释放所有用户叶页及各级页表页，包括根；移除特殊映射但不释放其trampoline和trapframe物理页。
    post:
      - NULL不操作；非空页表不可再访问；不回收mmap节点或进程内核栈。
  'int uvm_copy_pgtbl(pgtbl_t old, pgtbl_t new, uint64 heap_top, uint64 ustack_npage, mmap_region_t *mmap);':
    pre:
      - old的元数据与映射一致；new为独立根，目标用户区为空，可已有自己的trampoline和trapframe映射。
    effects:
      - 复制代码、已分配堆、栈和mmap全部用户页面；保留用户权限及内容，为副本分配独立物理页。
    post:
      - 成功返回0；old不变，new中用户布局等价且修改互不影响。
      - 元数据范围非法或资源不足返回-1；old及new操作前映射不变，本次副本资源全部释放；不复制或共享mmap节点，不改变特殊映射所有权。
  'void mmap_init(void);':
    pre:
      - 节点池尚未分配给任何进程，初始化只执行一次。
    effects:
      - 初始化节点池锁及全部空闲节点。
    post:
      - MMAP_REGION_COUNT个节点可独立分配，每个index在池中唯一。
  'mmap_region_t *mmap_region_alloc(void);':
    effects:
      - 从池取走一个空闲节点，清空区间、权限和链接，保留index。
    post:
      - 成功返回调用者独占节点；耗尽返回NULL且池不变。
  'void mmap_region_free(mmap_region_t *mmap);':
    pre:
      - mmap为池中由调用者独占且已脱离进程链的节点。
    effects:
      - 将节点归还空闲池。
    post:
      - 节点可重新分配；无效指针、重复回收或仍被使用属于不变量错误。
  'uint64 uvm_mmap_find(mmap_region_t *head_mmap, uint64 len, mmap_region_t **p_last_mmap, mmap_region_t **p_tmp_mmap);':
    pre:
      - head_mmap符合mmap链规则；非NULL输出指针可写。
    effects:
      - 成功时输出所选区间的前驱和后继；不改变链或页表。
    post:
      - len非零且页对齐时返回[MMAP_BEGIN, MMAP_END)内最低可容纳len字节的空洞起点。
      - len非法或无足够连续空洞返回0，输出参数不改变。
  'uint64 uvm_mmap(uint64 begin, uint32 npages, int perm);':
    effects:
      - 为当前进程建立npages个清零用户页，发布并合并对应mmap节点。
    post:
      - begin为0时选最低可用区间，否则在指定页对齐地址映射；成功返回实际非零起点。
      - npages必须非零且区间完全位于mmap范围；已有映射不得覆盖；perm仅允许PTE_R|PTE_W|PTE_X组合且必须含PTE_R。
      - 参数非法、无当前进程、重叠、无空洞或数据页/页表页/节点不足返回0，保留原映射及链并释放临时资源。
  'int uvm_munmap(uint64 begin, uint32 npages);':
    effects:
      - 移除当前进程指定mmap页并回收物理页；裁剪、删除或拆分相交节点。
    post:
      - begin页对齐、npages非零且范围被mmap连续覆盖时返回0，剩余链仍有序且无重叠；可跨多个相邻区间。
      - 越界、溢出、空洞、非mmap映射或拆分节点不足返回-1，页表和链完全不变；拆分需要的节点必须在解除映射前取得。
