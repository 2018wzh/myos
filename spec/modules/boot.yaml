module: kernel/boot
owns:
- src/kernel/boot/entry.S
- src/kernel/boot/start.c
- src/kernel/main.c
state:
  boot_stacks: 每 hart 独立的页对齐早期栈；有效 hart 为 0..HART_COUNT-1，HART_COUNT 为 1 或 2。
  kernel_ready: hart 0 完成共享初始化后以 release 发布；其他 hart 以 acquire 等待后使用共享状态。
  CSR: 机器启动寄存器、PMP、委托和中断配置；每 hart 独立，首次进入 S-mode 前完成。
rules:
- 共享模块只由 hart 0 初始化一次；所有有效 hart 都安装自己的页表和 trap 环境。
functions:
  _entry:
    pre:
    - QEMU virt 从 0x80000000 在 M-mode 进入。
    effects:
    - 设置当前 hart 的 sp，使用自己的早期栈。
    post:
    - 有效 hart 设置独立栈后调用 start；范围外 hart 留在停驻循环，不访问有效 hart 栈。
  void start(void):
    effects:
    - 修改当前 hart 的 PMP、委托、特权级、timer 与页表 CSR。
    post:
    - 配置 PMP 允许 S-mode 访问物理内存，委托异常和监督者中断，安装机器 timer。
    - tp 保存 hart id，使用 bare 页表；设置浮点状态可用，通过 mret 进入 S-mode 的 main，不返回。
  void init(void):
    pre:
    - 仅 hart 0 调用，其他 hart 尚未访问这些共享对象。
    effects:
    - 初始化共享模块。
    post:
    - 依次建立打印、物理内存、内核页表和进程基础；此时还未发布 kernel_ready。
  int main(void):
    effects:
    - 初始化与发布全局状态，安装本 hart 执行环境，输出启动提示。
    post:
    - hart 0 完成 init 和本 hart trap 环境，发布 kernel_ready 后调用 proc_make_first。
    - 其他 hart 等待发布后安装本 hart 页表和 trap，留在可处理中断的内核循环；各 hart 输出就绪提示。
    - 主流程不返回。
