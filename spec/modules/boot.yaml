module: kernel/boot
owns:
  - src/kernel/boot/entry.S
  - src/kernel/boot/start.c
  - src/kernel/main.c
state:
  boot_stacks: 每个启用hart有独立、16字节对齐且至少一页的早期栈。
  kernel_ready: hart0完成共享初始化后以release发布，其他hart以acquire读取。
rules:
  - QEMU virt从0x80000000的_entry进入M-mode；只启用构建选择的hart，其他hart停驻。
  - hart0初始化共享内存、mmap池、进程表及全局设备状态；每个启用hart独立安装内核页表、中断入口并进入scheduler。
  - 共享初始化失败使内核无法启动时panic；普通用户错误不走启动失败路径。
functions:
  "_entry":
    pre:
      - M-mode，mhartid有效，镜像已装入物理启动地址。
    effects:
      - 按hart选择早期栈后调用start；未启用hart停驻。
    post:
      - 启用hart以独立栈进入start；不会使用另一hart的栈。
  "void start(void);":
    pre:
      - 当前处于M-mode且早期栈有效。
    effects:
      - 设置PMP允许S-mode访问RAM和设备，委派异常和中断，初始化机器时钟，设置tp为hart编号；准备mepc为main及MPP为S，关闭分页后mret。
    post:
      - main在S-mode运行；S-mode trap入口建立前不启用全局监督者中断。
  "void init(void);":
    pre:
      - 仅hart0调用，尚未发布kernel_ready，未持锁。
    effects:
      - 初始化打印、物理内存、内核页表、mmap池、进程表。
    post:
      - 共享基础设施可用，或因无法完成必要初始化而panic。
  "int main(void);":
    effects:
      - hart0完成共享初始化和首进程创建后发布kernel_ready；其他hart等待发布；每hart安装本地页表和trap入口并进入proc_scheduler。
    post:
      - 每个启用hart持续调度；首进程通过RUNNABLE状态进入调度流程，本函数不正常返回。
