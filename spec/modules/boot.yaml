module: kernel/boot
owns:
  - src/kernel/boot/entry.S
  - src/kernel/boot/start.c
  - src/kernel/main.c
state:
  boot_stacks: 每个允许启动hart独立的一页早期栈。
  kernel_ready: hart0完成共享初始化后以release发布，其他hart以acquire等待。
rules:
  - HARTS默认为2，只允许1或2；超出配置的hart停驻，不使用有效hart的栈或cpu记录。
  - 共享初始化仅执行一次，各hart分别安装内核页表和trap向量；共享状态发布前不可由辅助hart使用。
  - hart0在Lab5直接创建并切入proczero，辅助hart留在内核；调度器不属于本阶段。
  - 内核ELF入口是_entry，M-mode的start以mepc设置内核main并mret，不能依赖C函数排列。
functions:
  _entry:
    pre:
      - QEMU virt从内核ELF入口以M-mode启动，mhartid可用。
    effects:
      - 为允许启动的hart设置独立早期sp并调用start。
    post:
      - 合法hart进入start，其他hart停驻；不返回给固件。
  'void start(void);':
    pre:
      - 当前hart在M-mode且早期栈可用。
    effects:
      - 设置PMP允许S-mode访问物理内存，委托异常及监督者中断，配置机器定时器并设置tp为hart编号。
      - 设置MPP为S、浮点状态为initial，保持全局中断关闭，关闭分页并将mepc设置为内核main后mret。
    post:
      - 当前hart在S-mode执行main，内核向量安装前不打开全局中断。
  'void init(void);':
    pre:
      - 由hart0调用一次。
    effects:
      - 依次初始化console、物理内存、内核页表、mmap节点池及进程状态。
    post:
      - 共享资源可供各hart配置及首进程创建使用；未发布用户进程。
  'int main(void);':
    pre:
      - start已完成当前hart的监督者交接。
    effects:
      - hart0完成共享和本hart页表/trap初始化，发布kernel_ready，然后执行proc_make_first。
      - 辅助hart等待kernel_ready，安装本hart页表及trap后停驻。
    post:
      - 正常执行不返回；HARTS=1与HARTS=2均执行同一用户入口路径。
